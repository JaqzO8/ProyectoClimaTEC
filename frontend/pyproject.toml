[project]
name = "proyectoclimatico-frontend"
version = "0.1.0"
description = "Reflex Frontend for ProyectoClimatico"
authors = [{ name = "ProyectoClimatico Team" }]
requires-python = ">=3.11"
dependencies = [
    "reflex>=0.4.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["B008", "E501", "E402", "RUF012"]
