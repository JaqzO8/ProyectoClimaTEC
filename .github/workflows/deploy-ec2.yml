name: Deploy to AWS EC2

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      frontend_public_url:
        description: "URL pública personalizada (opcional, ej: http://54.83.78.130:3000)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to EC2 Instance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check AWS EC2 Secrets Configuration
        id: check_secrets
        run: |
          if [ -z "${{ secrets.EC2_HOST }}" ] || [ -z "${{ secrets.EC2_SSH_KEY }}" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::warning::Los secretos EC2_HOST y/o EC2_SSH_KEY no están configurados en GitHub Secrets."
            echo "### ⚠️ Despliegue pendiente de secretos en GitHub" >> $GITHUB_STEP_SUMMARY
            echo "Por favor agrega **EC2_HOST**, **EC2_USER** y **EC2_SSH_KEY** en **Settings > Secrets and variables > Actions** del repositorio." >> $GITHUB_STEP_SUMMARY
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Execute Remote Deployment via SSH
        if: steps.check_secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ec2-user' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          timeout: 180s
          command_timeout: 30m
          envs: GITHUB_SHA
          script: |
            export REPO_URL="https://github.com/${{ github.repository }}.git"
            export BRANCH="main"
            export FRONTEND_PUBLIC_URL="${{ inputs.frontend_public_url || vars.FRONTEND_PUBLIC_URL || '' }}"
            
            mkdir -p ~/scripts
            cat << 'EOF' > ~/scripts/deploy_runner.sh
            #!/usr/bin/env bash
            set -e
            APP_DIR="${HOME}/Proyecto_Climatico"
            
            if [ ! -d "$APP_DIR" ]; then
                git clone -b main "https://github.com/${{ github.repository }}.git" "$APP_DIR"
            fi
            
            cd "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main
            chmod +x scripts/deploy_ec2.sh
            ./scripts/deploy_ec2.sh
            EOF

            chmod +x ~/scripts/deploy_runner.sh
            ~/scripts/deploy_runner.sh
