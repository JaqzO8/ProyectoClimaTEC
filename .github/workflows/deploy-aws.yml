name: Deploy to AWS ECS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || 'arn:aws:iam::123456789012:role/proyectoclimatico-dev-github-oidc-role' }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Backend Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/proyectoclimatico-backend:$IMAGE_TAG ./backend
          docker tag $ECR_REGISTRY/proyectoclimatico-backend:$IMAGE_TAG $ECR_REGISTRY/proyectoclimatico-backend:latest
          docker push $ECR_REGISTRY/proyectoclimatico-backend:$IMAGE_TAG
          docker push $ECR_REGISTRY/proyectoclimatico-backend:latest

      - name: Build and Push Frontend Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/proyectoclimatico-frontend:$IMAGE_TAG ./frontend
          docker tag $ECR_REGISTRY/proyectoclimatico-frontend:$IMAGE_TAG $ECR_REGISTRY/proyectoclimatico-frontend:latest
          docker push $ECR_REGISTRY/proyectoclimatico-frontend:$IMAGE_TAG
          docker push $ECR_REGISTRY/proyectoclimatico-frontend:latest

      - name: Deploy to ECS Fargate
        run: |
          aws ecs update-service --cluster proyectoclimatico-dev-cluster --service proyectoclimatico-dev-backend-svc --force-new-deployment
          aws ecs update-service --cluster proyectoclimatico-dev-cluster --service proyectoclimatico-dev-frontend-svc --force-new-deployment
