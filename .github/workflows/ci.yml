name: CI Quality Gates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/pyproject.toml .[dev]

      - name: Lint with Ruff
        run: ruff check backend

      - name: Typecheck with Mypy
        run: mypy backend

      - name: Run Backend Tests
        run: pytest backend/tests --cov=app --cov-report=term-missing --cov-fail-under=80

  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r frontend/pyproject.toml .[dev]

      - name: Lint with Ruff
        run: ruff check frontend

      - name: Run Frontend Tests
        run: pytest frontend/tests

  terraform-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Format Check
        run: terraform fmt -check -recursive infra/terraform

      - name: Validate Dev Config
        run: |
          cd infra/terraform/envs/dev
          terraform init -backend=false
          terraform validate
