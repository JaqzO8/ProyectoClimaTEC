name: Docker Image Build Validation

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build and start production containers
        run: docker compose up --build --wait --wait-timeout 180
      - name: Verify both HTTP services and Reflex events
        run: |
          curl --fail --retry 5 --retry-delay 2 http://localhost:8000/health
          curl --fail http://localhost:3000/ > /dev/null
          curl --fail http://localhost:3000/ping
          docker compose exec -T frontend python -c "import urllib.request; urllib.request.urlopen('http://backend:8000/health', timeout=5)"
          docker compose exec -T backend python -c "import os; assert os.getuid() != 0"
          docker compose exec -T frontend python -c "import os; assert os.getuid() != 0"
      - name: Browser smoke tests (mock weather, real UI and API)
        run: |
          docker compose -f compose.yml -f tests/e2e/compose.test.yml up -d --wait --wait-timeout 90
          python -m pip install -r tests/e2e/requirements.txt
          python -m playwright install --with-deps chromium
          python -m pytest tests/e2e -v
      - name: Container diagnostics
        if: failure()
        run: docker compose logs --no-color --tail=150
      - name: Stop test stack
        if: always()
        run: docker compose down
